name: termplex
base: core24
title: Termplex
summary: A terminal emulator
description: |
  Termplex is a fast, feature-rich, and cross-platform terminal emulator that
  uses platform-native UI and GPU acceleration.
grade: stable
confinement: classic
contact: https://github.com/abdokhaire/termplex/discussions
issues: https://github.com/abdokhaire/termplex/issues
website: https://termplex.org
source-code: https://github.com/abdokhaire/termplex
donation: https://github.com/sponsors/abdokhaire
license: MIT
icon: images/icons/icon_512.png
adopt-info: termplex

platforms:
  amd64:
  arm64:

apps:
  termplex:
    command: bin/termplex-app
    command-chain: [app/launcher]
    completer: share/bash-completion/completions/termplex.bash
    desktop: share/applications/com.termplex.app.desktop
    #refresh-mode: ignore-running # Store rejects this, needs fix in review-tools
    environment:
      PATH: /snap/termplex/current/bin:/snap/termplex/current/usr/bin:$PATH
      LC_ALL: C.UTF-8
      TERMPLEX_RESOURCES_DIR: /snap/termplex/current/share/termplex

parts:
  launcher:
    plugin: dump
    source: snap/local
    source-type: local
    organize:
      launcher: app/

  zig:
    plugin: nil
    build-packages:
      - curl
    override-pull: |
      set -ex
      case "$CRAFT_ARCH_BUILD_FOR" in
        amd64)  arch=x86_64    ;;
        arm64)  arch=aarch64  ;;
        *)      arch=""     ;;
      esac

      rm -rf $CRAFT_PART_SRC/*

      if [[ -n $arch ]]; then
        curl -LO --retry-connrefused --retry 10 https://ziglang.org/download/0.15.2/zig-$arch-linux-0.15.2.tar.xz
      else
        echo "Unsupported arch"
        exit 1
      fi

      tar xf zig-$arch-lin*xz
      rm -f *xz
      mv zig-$arch-linux*/* .
    prime:
      - -*

  termplex:
    source: .
    after: [zig]
    plugin: nil
    build-attributes: [enable-patchelf]
    build-packages:
      - libgtk-4-dev
      - libadwaita-1-dev
      - libxml2-utils
      - git
      - patchelf
      - gettext
    # TODO: Remove -fno-sys=gtk4-layer-shell when we upgrade to a version that packages it Ubuntu 24.10+
    override-build: |
      $CRAFT_PART_SRC/../../zig/src/zig build dist -j1 -Dapp-runtime=gtk -fno-sys=gtk4-layer-shell
      archive=$(find zig-out/dist -maxdepth 1 -type f -name 'termplex-*.tar.gz' | sort | tail -n1)
      version=${archive##*/}
      version=${version#termplex-}
      version=${version%.tar.gz}
      craftctl set version="$version"
      $CRAFT_PART_SRC/../../zig/src/zig build \
        -Dsnap \
        -Dpatch-rpath=\$ORIGIN/../usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR:/snap/core24/current/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR \
        -Doptimize=ReleaseFast \
        -Dcpu=baseline \
        -fno-sys=gtk4-layer-shell
      cp -rp zig-out/bin zig-out/lib zig-out/share $CRAFT_PART_INSTALL/
      sed -i 's|Icon=com.termplex.app|Icon=${SNAP}/share/icons/hicolor/512x512/apps/com.termplex.app.png|g' $CRAFT_PART_INSTALL/share/applications/com.termplex.app.desktop
    prime:
      - -include
      - -lib/libtermplex-vt.so*
      - -share/pkgconfig

  libs:
    plugin: nil
    build-attributes: [enable-patchelf]
    stage-packages:
      - libadwaita-1-0
      - libglib2.0-0t64
      - libgtk-4-1
      - libgtk-4-media-gstreamer
      - ibus-gtk4
      - libpciaccess0
      - libtinfo6
      - libedit2
      - libelf1t64
      - libsensors5
      - libllvm17
      - libunistring5
      - librsvg2-2
      - librsvg2-common
      - libgdk-pixbuf-2.0-0
      - on amd64:
          [
            i965-va-driver,
            libdrm-intel1,
            libdrm-nouveau2,
            libdrm-amdgpu1,
            libdrm-radeon1,
          ]
    stage:
      # The libraries in dri need no-patchelf, so they come from the mesa-unpatched part
      - -usr/lib/*/dri

  mesa:
    plugin: nil
    build-attributes: [enable-patchelf]
    stage-packages:
      - libglu1-mesa
      - libgl1-mesa-dri
      - libegl-mesa0
      - libegl1
      - libglx-mesa0
      - mesa-libgallium
    stage:
      # The libraries in dri need no-patchelf, so they come from the mesa-unpatched part
      - usr/lib/*/*.so*
      - usr/lib/*/dri/libdril_dri.so
      - -usr/lib/*/libxml2.so.*
      - -usr/lib/*/libgallium*so
      - -usr/lib/*/dri

  mesa-gl1-dri:
    plugin: nil
    stage-packages:
      - libgl1-mesa-dri
    build-packages:
      - patchelf
    build-attributes: [no-patchelf]
    override-prime: |
      craftctl default
      for lib in "$CRAFT_PRIME"/usr/lib/*/libgallium-*.so; do
        if [ -f "$lib" ]; then
          patchelf --set-rpath "\$ORIGIN:/snap/core24/current/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR" "$lib"
        fi
      done
    stage:
      # Only the libraries in dri need to not be patched, the rest come from the mesa part
      # Otherwise snapcraft may strip the build ID and cause the driver to crash
      - usr/lib/*/libgallium*so
      - -usr/lib/*/dri/libdril_dri.so
      - usr/lib/*/dri
